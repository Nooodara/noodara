# noodara SSH test fixture sshd configuration (02-02-PLAN.md Task 1).
#
# KbdInteractiveAuthentication is required by D-03: the adapter tries `password` and
# `keyboard-interactive` with the same password, so the fixture must actually offer both methods.
PubkeyAuthentication yes
PasswordAuthentication yes
KbdInteractiveAuthentication yes
UsePAM yes
PermitRootLogin prohibit-password
LoginGraceTime 30
MaxStartups 20
LogLevel VERBOSE
