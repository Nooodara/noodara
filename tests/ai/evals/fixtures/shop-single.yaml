              STRIPE_API_KEY: "<secret:stripe_api_key>"
            deployments:
              - status: SUCCESS
                commit: 4f1c2ab
                imageRef: "ghcr.io/shop/payments-api:1.8.1"
                startedMinutesAgo: 4320
              - status: SUCCESS
                commit: 9d0e7f3
