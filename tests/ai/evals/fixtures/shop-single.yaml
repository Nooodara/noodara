# One healthy server running one project: the baseline for location, memory, domain and topology.
id: shop-single
description: One connected server running the shop project in production; every service is healthy.
now: "2026-11-01T12:00:00Z"
servers:
  - name: web-1
    status: CONNECTED
    ramMb: 8192
    cpuCores: 4
    diskTotalMb: 81920
    diskUsedMb: 30720
    memoryUsedMb: [4100, 4150, 4200, 4180, 4220]
    cpuPercent: [22, 25, 31, 28, 26]
projects:
