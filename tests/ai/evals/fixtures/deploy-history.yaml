# Deployment history: what changed, rollbacks, cancelled attempts and restarts caused by deploys.
id: deploy-history
description: The blog project with a deployment history per service, including a failed build, a rollback and a cancellation.
now: "2026-11-01T12:00:00Z"
servers:
  - name: ci-1
    status: CONNECTED
    ramMb: 4096
    diskTotalMb: 61440
    diskUsedMb: 20480
    memoryUsedMb: [1500, 1520, 1510]
projects:
  - name: blog
    environments:
      - name: production
        services:
          - name: blog-api
            server: ci-1
            status: RUNNING
            repository: "https://github.com/blog/api"
            memoryLimitMb: 1024
            container:
              state: running
              healthcheck: healthy
              restartCount: 1
            memoryUsedMb: [300, 305, 310]
            domains: [api.blog.example.com]
            env:
              ADMIN_TOKEN: "<secret:blog_admin_token>"
            deployments:
              - status: SUCCESS
                commit: 11aa22b
                imageRef: "noodara/blog-api:11aa22b"
                startedMinutesAgo: 20000
              - status: SUCCESS
                commit: 33cc44d
                imageRef: "noodara/blog-api:33cc44d"
                startedMinutesAgo: 9000
              - status: FAILED
                commit: 55ee66f
                errorCode: BUILD_FAILED
                errorMessage: "tsc: src/routes/posts.ts(42,7): Type 'string' is not assignable to type 'number'"
                startedMinutesAgo: 600
                durationSeconds: 70
              - status: SUCCESS
                trigger: webhook
                commit: 77aa88b
                imageRef: "noodara/blog-api:77aa88b"
                startedMinutesAgo: 25
                durationSeconds: 140
            logs:
              - source: deploy
                secondsAgo: 1400
                text: "replacing container for deployment #4 (77aa88b)"
              - secondsAgo: 1350
                text: "blog-api started, migrations applied: 20261101_add_post_tags"
          - name: blog-web
            server: ci-1
            status: RUNNING
            repository: "https://github.com/blog/web"
            container:
              state: running
              healthcheck: healthy
            domains: [blog.example.com]
            deployments:
              - status: SUCCESS
                commit: 9a8b7c6
                imageRef: "noodara/blog-web:9a8b7c6"
                startedMinutesAgo: 5000
              - status: ROLLED_BACK
                commit: 5d4e3f2
                errorCode: HEALTHCHECK_FAILED
                errorMessage: "healthcheck /health returned 500 for 120s"
                startedMinutesAgo: 90
                durationSeconds: 210
            logs:
              - source: deploy
                secondsAgo: 5300
                level: error
                text: "healthcheck failed, restoring deployment #1 (9a8b7c6)"
          - name: newsletter
            server: ci-1
            status: RUNNING
            image: "ghcr.io/blog/newsletter:1.2.0"
            healthcheckPath: null
            container:
              state: running
            deployments:
              - status: SUCCESS
                imageRef: "ghcr.io/blog/newsletter:1.2.0"
                startedMinutesAgo: 7000
              - status: CANCELLED
                imageRef: "ghcr.io/blog/newsletter:1.3.0"
                startedMinutesAgo: 120
                durationSeconds: 15
secrets:
  - name: blog_admin_token
    value: "NOODARA_CANARY_bc41f8d3d6ae7975597b63b80fee915b"
