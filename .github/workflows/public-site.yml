name: Publish site

# Plan 10-03 (SITE-02, D-11/D-12/D-13): publishes `apps/site`'s static export to GitHub Pages on
# every push to main. This is deliberately a separate workflow from release.yml: different
# cadence (every push to main vs. a version tag), a different, public artifact (a static site vs.
# multi-arch container images), and no shared token scope -- release.yml never touches Pages and
# this workflow never touches GHCR (D-13: the site never enters release.yml or any
# docker-compose*.yml, asserted by tests/unit/scripts/check-workflow-pins.test.ts).
#
# No Pages-configuration action step: apps/site/site-config.mjs already computes its own basePath
# from apps/site/public/CNAME at build time (10-01, D-12), so there is nothing left for a separate
# setup action to resolve -- one fewer action, one fewer permission.
#
# No path filter on the push trigger above: D-13 notes captures, tokens and copy that affect the
# site live outside apps/site (packages/ui/brand, docs/ui/approved, docs/install.md), so scoping
# the trigger to a subdirectory would silently skip a real publish-worthy change.
#
# Repo Settings -> Pages -> "Build and deployment" -> Source must be set to "GitHub Actions" once
# (a one-time manual repo setting this workflow cannot make itself) -- see apps/site/README.md.
#
# Every third-party `uses:` below is pinned to a 40-character commit SHA with its human-readable
# tag as a trailing comment, verified live via `gh api repos/<repo>/tags` on 2026-09-27 (see the
# plan's own <interfaces> block), and enforced by scripts/check-workflow-pins.mjs.

on:
  push:
    branches: [main]
  # Lets the site be re-published manually (e.g. right after changing Pages settings) without
  # needing an empty commit to main.
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

env:
  NODE_VERSION: '22'

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    # A cold pnpm install plus one static `next build --output export` of a single small app --
    # well under ci.yml's own 15-minute unit-job budget for a much larger full-workspace run.
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # apps/site/site-config.mjs's describeLatestTag() reads the latest `v*` git tag for the
          # footer version (D-06); a shallow checkout would make every build fall back silently.
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # apps/site/public/CNAME is a committed file, so this build always exercises the real,
      # root-basePath production shape (10-RESEARCH.md Pitfall 4) -- never the `/noodara` preview
      # subpath.
      - run: pnpm --filter @noodara/site build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/site/out

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
