name: Publish site

# Plan 10-03 (SITE-02, D-11/D-12/D-13), amended quick-260928-gmm (D-11a/D-12a/D-13a): publishes
# `apps/site`'s static export to Cloudflare Pages (project `noodara-site`, Direct Upload) on
# every push to main. This is deliberately a separate workflow from release.yml: different
# cadence (every push to main vs. a version tag), a different, public artifact (a static site vs.
# multi-arch container images), and no shared token scope -- release.yml never touches Cloudflare
# and this workflow never touches GHCR (D-13: the site never enters release.yml or any
# docker-compose*.yml, asserted by tests/unit/scripts/check-workflow-pins.test.ts).
#
# Single job, no artifact hand-off: Cloudflare Pages has no equivalent of GitHub Pages' separate
# upload/deploy actions -- `cloudflare/wrangler-action` builds nothing itself, it just uploads
# `apps/site/out` directly with `wrangler pages deploy`, so build and deploy stay one job.
#
# No path filter on the push trigger above: D-13 notes captures, tokens and copy that affect the
# site live outside apps/site (packages/ui/brand, docs/ui/approved, docs/install.md), so scoping
# the trigger to a subdirectory would silently skip a real publish-worthy change.
#
# One-time setup this workflow cannot make itself: create the Cloudflare Pages project
# `noodara-site` (Direct Upload, no git integration) and add `CLOUDFLARE_API_TOKEN`/
# `CLOUDFLARE_ACCOUNT_ID` as GitHub repo secrets -- see apps/site/README.md.
#
# Every third-party `uses:` below is pinned to a 40-character commit SHA with its human-readable
# tag as a trailing comment, verified live via `gh api repos/<repo>/tags` / `git ls-remote --tags`
# on 2026-09-27/2026-09-28 (see the plan's own <interfaces> block), and enforced by
# scripts/check-workflow-pins.mjs.

on:
  push:
    branches: [main]
  # Lets the site be re-published manually (e.g. right after changing the Pages project) without
  # needing an empty commit to main.
  workflow_dispatch:

permissions: {}

concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

env:
  NODE_VERSION: '22'

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    # A cold pnpm install plus one static `next build --output export` of a single small app,
    # plus a wrangler upload -- well under ci.yml's own 15-minute unit-job budget for a much
    # larger full-workspace run.
    timeout-minutes: 15
    permissions:
      contents: read
    environment:
      name: production
      url: https://noodara.com
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # apps/site/site-config.mjs's describeLatestTag() reads the latest `v*` git tag for the
          # footer version (D-06); a shallow checkout would make every build fall back silently.
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # basePath is always root on Cloudflare Pages (D-12a) -- no CNAME file, no preview subpath.
      #
      # quick-260928-m8j: `pnpm site:build` (turbo run build --filter=@noodara/site), NOT
      # `pnpm --filter @noodara/site build` directly -- see ci.yml's `site` job for the full
      # rationale (Turbo's `^build` edge builds @noodara/domain and @noodara/ui first).
      - run: pnpm site:build
      - uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/site/out --project-name=noodara-site --branch=main
          wranglerVersion: '4.143.0'
