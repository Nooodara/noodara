name: CI

# QA-01: every pull request runs lint, typecheck, unit, light integration, gitleaks and
# `pnpm audit`, and a failure in any of them blocks the merge. Every job below calls the exact
# same pnpm script a developer runs locally (see CLAUDE.md §3.2) rather than a parallel
# CI-only invocation that could drift from what's actually enforced pre-commit.
#
# NOTE (repo layout): this workflow assumes `noodara/code` IS the repository root — there is
# no `working-directory` indirection anywhere below. The monorepo currently lives nested under
# a personal workspace and has not been pushed anywhere yet; when it is pushed, this directory
# becomes the root of its own git repository, matching every path used here.
#
# Full E2E (Playwright, QA-04): the `e2e` job below runs the whole real-browser suite —
# including tests/e2e/critical-path.spec.ts's real-sshd flow — on every pull request and on
# main, exactly like every other job here calling the same `pnpm test:e2e` a developer runs
# locally. The nightly repetition (×20), the 100-consecutive-connection stress suite and the
# security canary scan live in .github/workflows/nightly.yml instead — too slow for every PR.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Vitest 5 requires Node >=22.12; this is the Node 22 LTS line pinned in .nvmrc/engines.
  NODE_VERSION: '22'
  # apps/web/next.config.ts's rewrites() reads this at `next build` time (fail-fast, no literal
  # fallback -- docs/adr/0006) and both `pnpm build` (boot-smoke) and `pnpm test:integration`
  # (its own globalSetup calls the same `buildWorkspace()` helper) invoke a real workspace build.
  # Not a secret -- CI never actually proxies traffic, this only has to be a non-empty string for
  # the build step to complete; the dev-convention value keeps it self-documenting.
  NOODARA_API_ORIGIN: 'http://localhost:3100'

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  boundaries:
    name: boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Enforces the Turborepo import rule keeping packages/domain pure (zero I/O), so the
      # boundary can't erode silently once it's only checked by habit locally (T-1-52).
      - run: pnpm boundaries

  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `pnpm test --coverage` (NOT `pnpm test -- --coverage`, which pnpm forwards to Vitest
      # as a literal `-- --coverage` positional filter and silently skips coverage). The
      # `packages/domain` glob threshold (>=95% statements/branches) in vitest.config.ts is
      # what actually enforces QA-02 here — a PR that erodes it fails this job.
      - run: pnpm test --coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  integration:
    name: integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # ubuntu-latest ships a working Docker daemon, so Testcontainers spins up real
      # PostgreSQL and, from Phase 4 (04-01), a real `redis:7-alpine` container too, via
      # `tests/integration/helpers/redis.ts` — not a GitHub Actions `services:` block. The
      # fixture owns the container's lifecycle (start/stop, labelling) exactly like Postgres
      # and the sshd fixtures already do, so no static service container is declared here; the
      # `noodara.test=true` stray-container check below already covers any Redis container a
      # test forgets to stop.
      #
      # Phase 2 (02-10): this suite now also builds up to four project-owned sshd image variants
      # from `tests/integration/images/` (plain, `WITH_DOCKER_CLI=true`, `WITH_SLOW_DF=true`, per
      # Ubuntu version) via Testcontainers' `GenericContainer.fromDockerfile`. The cost of a cold
      # build is dominated by `apt-get` inside those Dockerfiles, not by anything Vitest itself
      # does — every base-image layer up to the conditional `RUN` is shared across the variants,
      # so a cold build pays for `apt-get` roughly once per Ubuntu version, not once per variant
      # (02-VALIDATION.md's "Cache note"). `ubuntu-latest` runners start cold on every run (no
      # persistent Docker layer cache across jobs), so this job pays the full image-build cost on
      # every invocation; a local `pnpm test:integration` re-run hits Docker's own layer cache and
      # skips the builds entirely. No cold-runner build time has been measured against a real
      # GitHub Actions run for this phase — see 02-VALIDATION.md's Test Infrastructure table for
      # what was and wasn't measured. No image-publishing or cross-job image-caching step is added
      # here on purpose: every image is built locally, used within this same job, and discarded —
      # none of that extra machinery is needed for a suite that never ships an image anywhere.
      - run: pnpm test:integration
      - name: Fail if any noodara.test container survived
        if: always()
        run: |
          stray=$(docker ps -aq --filter "label=noodara.test=true")
          if [ -n "$stray" ]; then
            echo "::error::stray containers labelled noodara.test=true survived the integration run"
            docker ps -a --filter "label=noodara.test=true"
            exit 1
          fi
          echo "no stray noodara.test=true containers"

  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so gitleaks can scan every commit, not just the checked-out tip.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # T-1-51: fails the merge on any high-or-critical advisory; --frozen-lockfile above
      # already stops CI from silently resolving a different dependency tree than the lockfile.
      - run: pnpm audit --audit-level=high
      # T-5-SC/T-5-09/T-5-11 (phase 5): makes ADR-0000's package-provenance gate part of the
      # merge gate rather than a manual habit — a future dependency addition that skips this
      # check (or a typosquat landing under the wrong owner/repo) now fails CI, not just a
      # local run someone forgot to do.
      - run: node scripts/check-package-provenance.mjs
      # SEC-02 (phase 3) / D-22 (phase 4): this script now runs three suites — the fast,
      # container-free Phase-1 canary (logger/HTTP-error/activity-log), a full-flow canary that
      # builds and starts a real Ubuntu sshd Testcontainer and drives a genuine register ->
      # connect+discover -> edit -> trust-fingerprint -> delete flow through it (D-18), and a
      # Phase-4 HTTP/SSE canary that submits per-run secrets through the real /api/servers routes
      # and scans success bodies, error bodies (4xx and a forced 500 through the real production
      # error handler), GET /api/events SSE frames, captured logs, activity_events.metadata and
      # discovery_snapshots.payload. Together they prove no per-run secret reaches the logger, a
      # service result, an HTTP response, an SSE frame, activity_events.metadata,
      # discovery_snapshots.payload or a simulated service error. The sshd container is the
      # intentional reason this step's runtime is longer than the Phase-1-only version, and the
      # phase-4 addition grows it further still. Plan 05-21 (QA-05) extends this same script with
      # tests/e2e/canary-ui.spec.ts's `@canary` Playwright spec, the browser-side half of the same
      # canary discipline (rendered HTML, console, both Web Storages, the URL/history, and every
      # response body the page received) -- one command now covers both halves.
      - run: pnpm security:scan-leaks
      - name: Fail if any noodara.test container survived
        if: always()
        run: |
          stray=$(docker ps -aq --filter "label=noodara.test=true")
          if [ -n "$stray" ]; then
            echo "::error::stray containers labelled noodara.test=true survived the security run"
            docker ps -a --filter "label=noodara.test=true"
            exit 1
          fi
          echo "no stray noodara.test=true containers"
      # T-1-50: gitleaks against the pull-request diff (or the push event's new commits) with
      # a path-scoped allowlist only (.gitleaks.toml) — never a broad regex that could hide a
      # real key. GITLEAKS_LICENSE is only required for private organization-owned repos; it is
      # a no-op for a public or personal-account repo and safe to leave unset.
      - name: gitleaks (diff / pushed commits)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
      # A wider, whole-tree scan is only affordable on push-to-main (no PR-diff time pressure)
      # and exists specifically so a narrow, path-scoped allowlist can't quietly widen over time
      # without anyone noticing a real secret slipping through elsewhere in the tree.
      - name: gitleaks (full tree, main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks detect --source . --config .gitleaks.toml --redact

  # boot-smoke is its own job (not folded into `integration`) because it gates the one defect
  # that survived all 33 tasks of phase 1: `pnpm dev` and `node dist/server.js` both failed with
  # `ERR_MODULE_NOT_FOUND` before INST-06's fail-fast validation could even run, and every other
  # "boot" proof in the phase went through Vitest's own module transform or `tsx`, never the
  # real committed command (01-VERIFICATION.md's BLOCKER, closed in Plan 01-16). This job runs
  # the real `pnpm build` then `pnpm test:boot`, so a resolution or task-graph regression fails
  # a named, red step instead of hiding inside a green integration run.
  #
  # `pnpm build` is kept as its own explicit step even though `tests/integration/global-setup.ts`
  # also builds the workspace: a build failure must surface as its own red step rather than as an
  # opaque global-setup crash, and this gate must never pass against a stale `dist`. On a cold
  # runner this build is the job's dominant cost; locally turbo caches it, so repeat local runs of
  # `pnpm test:boot` are fast.
  #
  # `tests/integration/boot/boot-command.test.ts`'s fourth case deliberately deletes both
  # `packages/domain/dist` and `apps/control-plane/dist` and then spawns the literal root
  # `pnpm dev`, proving turbo's `dev` -> `^build` edge holds on a genuinely clean tree; it rebuilds
  # in its own `afterAll`. That is why this job's `pnpm build` step is not redundant with the test
  # suite, and why removing it would not make the job meaningfully faster. Do not add a
  # `--filter`, a `--force`, or any cache-disabling flag here to work around that test, and do not
  # reorder these steps.
  boot-smoke:
    name: boot-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # From Phase 4 (04-01), `pnpm test:boot` also starts an ephemeral `redis:7-alpine`
      # Testcontainer (same `noodara.test=true`-labelled fixture as the `integration` job) so the
      # worker entrypoint's real Postgres+Redis fail-fast boot path is exercised here too — again
      # via the fixture's own lifecycle, never a `services:` block. From Plan 04-11, one case boots
      # both real entrypoints (`node dist/server.js` and `node dist/worker.js`) together against
      # that same Postgres+Redis and asserts `GET /health`'s `checks.worker` reports `pass` while
      # the worker is alive, then `degraded`/`fail` once it is killed and its real 30s heartbeat
      # TTL expires — the exact liveness signal Phase 6's Compose healthchecks/restart policy will
      # key on.
      - run: pnpm test:boot
      - name: Fail if any noodara.test container survived
        if: always()
        run: |
          stray=$(docker ps -aq --filter "label=noodara.test=true")
          if [ -n "$stray" ]; then
            echo "::error::stray containers labelled noodara.test=true survived the boot-smoke run"
            docker ps -a --filter "label=noodara.test=true"
            exit 1
          fi
          echo "no stray noodara.test=true containers"

  # QA-04 (Plan 05-20): the real Playwright suite (playwright.config.ts) — its own stack fixture
  # (tests/e2e/fixtures/stack.ts) boots Postgres, Redis, the built API, the worker and the built
  # web app together and drives every spec in tests/e2e/**, including critical-path.spec.ts's own
  # real Ubuntu sshd Testcontainer, against them. `pnpm build` stays its own explicit step for the
  # same reason `boot-smoke` keeps one above: a build failure must surface as its own red step,
  # never buried inside the stack fixture's own build call, and this gate must never run against a
  # stale dist/.next. `playwright install --with-deps chromium` is fine on this disposable runner —
  # unlike the harness-hygiene rule against `--with-deps`/sudo on a developer's own machine
  # (05-10-SUMMARY.md's own documented deviation for `e2e:install`), CI owns this whole container.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm test:e2e
      # Failure-only, short retention: a Playwright HTML report/screenshot can carry a typed (fake,
      # per the harness-hygiene rule every tests/e2e/**.spec.ts already follows) credential or a
      # session cookie, so this is never uploaded on a green run.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - name: Fail if any noodara.test container survived
        if: always()
        run: |
          stray=$(docker ps -aq --filter "label=noodara.test=true")
          if [ -n "$stray" ]; then
            echo "::error::stray containers labelled noodara.test=true survived the e2e run"
            docker ps -a --filter "label=noodara.test=true"
            exit 1
          fi
          echo "no stray noodara.test=true containers"
