name: Isolated SSH fixture diagnosis 35-03
on:
  push:
    branches: [task/35-03-ssh-diagnostics]
permissions:
  contents: read
concurrency:
  group: ssh-diagnosis-${{ github.ref }}
  cancel-in-progress: false
jobs:
  diagnose:
    if: github.ref == 'refs/heads/task/35-03-ssh-diagnostics'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ['22.04', '24.04']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate supervisor boundaries before fixture execution
        run: node --test tests/unit/integration-helpers/runner-supervisor.test.mjs docs/testing/ssh-fixture-timeouts/runner-supervisor-process.test.mjs
      - name: Observe actual legacy-build fixture without browser actions
        env:
          SSH_DIAGNOSTIC_UBUNTU: ${{ matrix.ubuntu }}
        run: node docs/testing/ssh-fixture-timeouts/runner.mjs
